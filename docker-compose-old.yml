version: '2'

services:
  # PHP-FPM Application Service
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID}
        GID: ${GID}
    container_name: cater_ci4_app
    restart: unless-stopped
    volumes:
      # Shared project codebase & public assets (rw for PHP-FPM)
      - app_code:/var/www/html
      # Dedicated persistent volume for writable storage
      - writable_data:/var/www/html/writable
      # Host bind mount for fotowm photos (read-only)
      - ${FOTOWM_PATH}:/var/www/html/fotowm:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - cater_network

  # Nginx Web Server Service
  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: cater_ci4_web
    restart: unless-stopped
    ports:
      - "${APP_PORT}:80"
    volumes:
      # Read-only shared codebase (provides public/ directory directly to Nginx)
      - app_code:/var/www/html:ro
      # Read-only host bind mount for fotowm photos
      - ${FOTOWM_PATH}:/var/www/html/fotowm:ro
    networks:
      - cater_network
    depends_on:
      - app

networks:
  cater_network:
    driver: bridge

volumes:
  app_code:
    driver: local
  writable_data:
    driver: local
