version: '3.8'

services:
  # PHP-FPM Development Application Service
  app:
    build:
      context: ..
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: cater_ci4_app_dev
    restart: unless-stopped
    volumes:
      # Direct host bind mount for development (read-write)
      - ..:/var/www/html
      # Host bind mount for fotowm photos (read-only)
      - ${FOTOWM_PATH:-../fotowm}:/var/www/html/fotowm:ro
      # Host bind mount for .env configuration (read-only or dev env)
      - ${ENV_FILE:-../.env}:/var/www/html/.env:ro
    environment:
      - XDEBUG_MODE=debug,develop
      - XDEBUG_CONFIG=client_host=host.docker.internal client_port=9003
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - cater_dev_network

  # Nginx Web Server Development Service
  web:
    build:
      context: ..
      dockerfile: docker/nginx/Dockerfile
    container_name: cater_ci4_web_dev
    restart: unless-stopped
    ports:
      - "${APP_PORT:-84}:80"
    volumes:
      # Direct host bind mount for web server (read-write or read-only public)
      - ..:/var/www/html:ro
      # Host bind mount for fotowm photos
      - ${FOTOWM_PATH:-../fotowm}:/var/www/html/fotowm:ro
    networks:
      - cater_dev_network
    depends_on:
      - app

networks:
  cater_dev_network:
    driver: bridge

volumes:
  # Keep volumes section if needed for compatibility, though bind mounts are used in dev
  writable_data:
    driver: local
